# Project-wide Gradle settings.

# ------------------------------------------------------------------
# Shrimp · ajustes para compilar en Android arm64 dentro de PRoot
# ------------------------------------------------------------------

# RAM: el móvil tiene ~1.7 GB libres. 1536m mataba el proceso; 1024m + 384m de
# metaspace entra de sobra para este proyecto (con swap como red de seguridad).
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configureondemand=false

# CLAVE: Google solo publica aapt2 para linux x86_64 (no se puede ejecutar en un
# SoC arm64) y el aapt2 de Debian (Android 14) no sabe leer la tabla de recursos
# compacta de API 35/36. Solución sin root: el aapt2 x86_64 auténtico de Google
# corriendo con qemu-user, envuelto en un script ejecutable.
# El nombre del fichero DEBE terminar en "aapt2": AGP hace endsWith("aapt2").
android.aapt2FromMavenOverride=/root/.local/bin/aapt2

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
